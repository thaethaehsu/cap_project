<title>MCS Candidate Assessment Panel</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: quiet plum-tinted workspace; left rail on desktop, bottom bar on phones; tables fold into cards. The one loud element is the three-step fit bar. */
:root{
  --bg:#F7F4F7; --surface:#FFFFFF; --sunk:#F1ECF2; --ink:#1E1420; --muted:#6A5E6C; --line:#E4DBE5;
  --brand:#600060; --brand-solid:#600060; --on-brand:#FFFFFF; --brand-soft:#F3E6F3;
  --ok:#1B6E46; --ok-soft:#E2F2E9; --warn:#8A4E00; --warn-soft:#FBEBD3; --bad:#A3241D; --bad-soft:#FBE5E3;
  --logo-bg:transparent;
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-sm:10px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:600;line-height:1.15}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600;font-family:var(--body);letter-spacing:0}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:16px} .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between} .grow{flex:1 1 0;min-width:0}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{display:inline-block;background:var(--logo-bg);border-radius:8px;padding:4px 6px}
.logo img{display:block;width:150px;height:auto}
.side .logo{margin:0 0 18px 4px;align-self:flex-start}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:var(--r-sm);text-decoration:none;color:var(--ink);font-weight:500;border:0;background:none;cursor:pointer;width:100%;text-align:left}
.nav svg{width:20px;height:20px;flex:none;color:var(--muted)}
.nav:hover{background:var(--sunk)}
.nav[aria-current="page"]{background:var(--brand-soft);color:var(--brand)} .nav[aria-current="page"] svg{color:var(--brand)}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.main{min-width:0;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mtop{display:none}
.bnav{display:none}
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.crumb{font-size:13px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:28px}
.crumb svg{width:16px;height:16px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand-solid);border-color:var(--brand-solid);color:var(--on-brand)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:28px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600}
.in{width:100%;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
textarea.in{padding:10px 14px;min-height:92px;resize:vertical}
.in:hover{border-color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;min-height:36px;padding:0 16px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(30,20,32,.12)}
.switch{display:inline-flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;min-height:44px;font-weight:600}
.switch i{width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"] i{background:var(--brand-solid)} .switch[aria-checked="true"] i::after{transform:translateX(20px)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.cols.wide-left{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.fig{padding:18px 20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.fig:first-child{border-left:0}
.fig b{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.brand{background:var(--brand-soft);color:var(--brand)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.line{background:none;border:1px solid var(--line);color:var(--muted)}
.note{background:var(--sunk);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;color:var(--muted)}
.alert{background:var(--brand-soft);border:1px solid var(--brand);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.alert b{color:var(--brand)}
.meter{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;min-width:60px}
.meter span{display:block;height:100%;background:var(--brand-solid);border-radius:999px}
.barrow{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 44px;gap:12px;align-items:center}
.barrow .v{text-align:right;font-weight:600}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}

/* fit bar: the signature element */
.fit{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.fit .bars{display:inline-flex;gap:3px} .fit .bars i{width:14px;height:8px;border-radius:3px;background:var(--line)}
.fit[data-b="low"] .bars i:nth-child(1){background:var(--muted)}
.fit[data-b="partial"] .bars i:nth-child(-n+2){background:var(--brand)}
.fit[data-b="strong"] .bars i{background:var(--brand-solid)}
.fit b{font-weight:600}
.band{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.band div{padding:12px 8px;border-radius:var(--r-sm);background:var(--sunk);color:var(--muted);text-align:center;font-weight:600;font-size:14px}
.band div.on{background:var(--brand-solid);color:var(--on-brand)}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--brand-solid) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring span{width:88px;height:88px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:600}

/* tables that fold into cards */
.tw{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:13px;font-weight:500;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.act{text-align:right;white-space:nowrap}
.steps{display:flex;flex-wrap:wrap;gap:8px 22px}
.step{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.step i{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:600}
.step.on{color:var(--brand)} .step.on i{background:var(--brand-solid);border-color:var(--brand-solid);color:var(--on-brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.doc{background:#FFFFFF;color:#000;border:1px solid var(--line);border-radius:6px;padding:26px 28px;font-family:Tahoma,Verdana,sans-serif;font-size:11px;display:flex;flex-direction:column;gap:9px;max-width:460px;width:100%;margin:0 auto;box-shadow:0 6px 24px rgba(30,20,32,.10)}
.doc img{width:110px;align-self:flex-end}
.doc .cv{text-align:right;line-height:1.3} .doc .cv small{display:block;color:#7F7F7F;font-weight:700;font-size:9px}
.doc .bar{background:#E6E6E6;border:1px solid #9a9a9a;color:#600060;font-weight:700;padding:4px 7px}
.doc .ln{height:7px;background:#ECECEC;border-radius:2px}
.imp{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand-solid);color:var(--on-brand);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-weight:500}
.imp .btn{min-height:36px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(20,10,22,.5);display:flex;align-items:flex-end}
.sheet>div{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;max-height:85%;overflow:auto}

/* sign in */
.auth{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);min-height:100%}
.auth-form{background:var(--surface);padding-block:40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;justify-content:center;gap:18px}
.auth-art{background:var(--brand-solid);color:var(--on-brand);padding:56px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px}
.auth-art h1{font-size:clamp(32px,4.2vw,56px);font-weight:600;line-height:1.02;max-width:12ch}
.wordmark{font-family:var(--display);font-size:26px;font-weight:700;color:var(--ink)}
.ptop{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.jobcard{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface)}
.jobcard.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)} .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .mtop .logo img{width:124px}
  .main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;background:none;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:12px;cursor:pointer}
  .bnav svg{width:22px;height:22px}
  .bnav [aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  h1{font-size:24px}
  .figs{grid-template-columns:repeat(2,minmax(0,1fr))} .fig:nth-child(3){border-left:0} .fig:nth-child(n+3){border-top:1px solid var(--line)}
  .cols.wide-left{grid-template-columns:minmax(0,1fr)}
  .auth{grid-template-columns:minmax(0,1fr)} .auth-art{order:-1;padding:28px 20px;min-height:0} .auth-art h1{font-size:28px;max-width:none} .auth-form{justify-content:flex-start;padding-block:28px}
}
@media (max-width:720px){
  .tw{overflow:visible;margin:0}
  .t thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .t,.t tbody{display:block}
  .t tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .t tr:last-child{border-bottom:0;padding-bottom:0} .t tr:first-child{padding-top:0}
  .t td{display:block;padding:0;border:0;min-width:0}
  .t td::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
  .t td.main,.t td.act{grid-column:1/-1} .t td.main::before,.t td.act::before{display:none}
  .t td.act{text-align:left} .t td:empty{display:none}
  .head .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

  `<div class="figs" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))"><div class="fig"><span class="muted small">Used this month</span><b class="num">310</b><span class="small muted">analyses, 62% of the limit</span></div><div class="fig"><span class="muted small">Monthly limit</span><b class="num">500</b><span class="small muted">for the MCS organisation</span></div><div class="fig"><span class="muted small">At the limit</span><b style="font-size:22px;line-height:1.5">New analyses stop</b><span class="small muted">until the Super Admin raises it</span></div></div>
  <section class="card"><div class="row between"><h2>Limits by person</h2><button class="btn sm" data-act="file" data-m="The default limit form opens in the full panel">Set default limit</button></div>
   ${T(['Person','Role','Monthly limit','Used',''],[...S.staff.filter(p=>p.a).map(p=>[who(p.n),p.r,`<span class="num">${p.r==='Recruiter'?200:20} analyses</span>`,`<div class="row" style="gap:10px;flex-wrap:nowrap"><div class="grow">${meter(p.use)}</div><span class="num small">${p.use}%</span></div>`,`<button class="btn sm" data-act="file" data-m="The limit form opens in the full panel">Edit limit</button>`]),[who('Each candidate'),'Candidate portal','<span class="num">2 CV uploads, 5 analyses</span>','<span class="small muted">Per candidate</span>',`<button class="btn sm" data-act="file" data-m="The limit form opens in the full panel">Edit limit</button>`]])}</section>
  <section class="card"><h2>Usage log</h2>${T(['Time','Person','Action','Job','Tokens'],[['12 Nov, 10:42','Mei Ling Tan','CV analysis','ServiceNow Developer (Squad C)','18,400'],['12 Nov, 10:15','Mei Ling Tan','Job card draft','ServiceNow Developer (Squad C)','6,200'],['12 Nov, 09:58','Arjun Pillai','Profile generation','HR Deputy Director','9,750']].map(r=>r.map((c,i)=>i===4?`<span class="num">${c}</span>`:c)))}</section>`;
},
audit(){
  const types=['All','Access','Users','Jobs','Candidate data','Outputs'], rows=S.audit.filter(r=>S.auditF==='All'||r[6]===S.auditF);
  return head('Audit log','Who did what, and when, in your organisation.')+
  `<section class="card"><div class="row between"><div class="field" style="flex:0 1 240px"><label for="au-f">Action type</label>${sel('au-f',types,S.auditF)}</div><span class="small muted">${rows.length} entries, last 7 days</span></div>
   ${T(['Action','Time','Person','Impersonating','Record','Details'],rows.map(r=>[`<b style="font-weight:600">${r[3]}</b>`,r[0],r[1],r[2],r[4],r[5]]))}
   <p class="note">Nobody can edit or delete entries, including the Super Admin. Each organisation sees only its own log.</p></section>`;
},
'new-organisation'(){
  return head('Create organisation','Add a company or agency to the panel.','',['organisations','Organisations'])+
  `<section class="card"><h2>Organisation details</h2><div class="cols">${field('no-name','Organisation name','<input class="in" id="no-name" placeholder="Company or agency name">')}${field('no-type','Type',sel('no-type',['Agency','Client'],'Agency'),'Agencies run their own panel. Clients only upload job descriptions.')}${field('no-code','Organisation code','<input class="in" id="no-code" maxlength="8" placeholder="For example NOVA">','Staff type this code on the sign-in page.')}</div></section>
  <section class="card"><h2>First admin</h2><p class="muted">This person manages the organisation’s own staff and signs in with a code sent to this email.</p><div class="cols">${field('no-an','Full name','<input class="in" id="no-an" autocomplete="off">')}${field('no-ae','Email','<input class="in" id="no-ae" type="email" placeholder="name@company.com" autocomplete="off">')}</div></section>
  <section class="card"><h2>Package</h2><div class="cols">${field('no-ai','Monthly AI limit, in analyses','<input class="in" id="no-ai" inputmode="numeric" value="300">')}${field('no-jobs','Open job limit','<input class="in" id="no-jobs" inputmode="numeric" value="10">')}</div>
   <p class="note">Agencies start with candidate assessment and email switched on. The Super Admin can change modules on the organisation page afterwards.</p>
   <p id="form-err" role="alert" hidden style="color:var(--bad);font-weight:600"></p>
   <div class="row" style="justify-content:flex-end"><a class="btn" href="#organisations">Cancel</a><button class="btn pri" data-act="create-org">Create organisation</button></div></section>`;
},
'new-staff'(){
  const r=S.nsRole||'Recruiter';
  return head('Create staff account','They join Magenta Consulting Services and sign in with a code sent by email.','',['staff','Staff'])+
  `<section class="card"><h2>Staff details</h2><div class="cols">${field('ns-n','Full name','<input class="in" id="ns-n" autocomplete="off">')}${field('ns-e','Work email','<input class="in" id="ns-e" type="email" placeholder="name@mcs.example" autocomplete="off">')}${field('ns-r','Role',sel('ns-r',['Recruiter','Support staff'],r))}${field('ns-l','Monthly AI limit, in analyses',`<input class="in" id="ns-l" inputmode="numeric" value="${r==='Recruiter'?200:20}">`)}</div>
   <p class="note" id="ns-note">${ROLE_NOTE[r]}</p>
   <p id="form-err" role="alert" hidden style="color:var(--bad);font-weight:600"></p>
   <div class="row" style="justify-content:flex-end"><a class="btn" href="#staff">Cancel</a><button class="btn pri" data-act="create-staff">Create account</button></div></section>`;
},
branding(){
  const up=(t,h)=>`<div class="stack" style="gap:8px"><h3>${t}</h3><div style="height:${h};border:1.5px dashed var(--line);border-radius:var(--r-sm);display:grid;place-items:center;background:var(--sunk)" class="small muted">${t==='Login logo'?LOGO:'No image yet'}</div><div class="row"><button class="btn sm" data-act="file" data-m="File upload opens in the full panel">Upload</button><button class="btn sm" data-act="file" data-m="Removed in the full panel">Remove</button></div></div>`;
  return head('Branding','Your organisation’s logo, banner and thumbnail on its sign-in page.',`<button class="btn pri" data-act="saved">Save changes</button>`)+
  `<section class="card"><div class="cols">${up('Login logo','96px')}${up('Login banner','96px')}${up('Thumbnail','96px')}</div></section>
   <section class="card"><div class="row between"><h2>Sign-in page</h2><a class="link" href="#signin">Open sign-in page</a></div><p class="muted">Staff enter the organisation code <b class="num">MCS</b> to load this branding.</p></section>`;
}
};

/* ---------- sign in and candidate portal ---------- */
function signin(cand){
  const nova=S.orgCode.trim().toUpperCase()==='NOVA';
  const mark=nova&&!cand?'<span class="wordmark">Nova Talent</span>':LOGO;
  const form=cand?`<div class="stack" style="gap:6px"><h1>Candidate sign in</h1><p class="muted">Upload your CV once and see how you match our open jobs.</p></div>
    ${field('cs-e','Email','<input class="in" id="cs-e" type="email" placeholder="you@example.com" autocomplete="email">')}${field('cs-p','Password','<input class="in" id="cs-p" type="password" autocomplete="current-password">')}
    <a class="btn pri" href="#portal" data-act="as-cand">Sign in</a><div class="row between"><button class="link" data-act="file" data-m="Registration opens in the full panel">Create an account</button><button class="link" data-act="file" data-m="We would email a reset link">Forgotten your password?</button></div>
    <p class="small muted" style="border-top:1px solid var(--line);padding-top:14px">Staff or partner? <a href="#signin">Organisation sign in</a></p>`
   :`<div class="stack" style="gap:6px"><h1>Organisation sign in</h1><p class="muted">${nova?'Nova Talent staff sign in here.':'For MCS staff and partner organisations.'}</p></div>
    ${field('si-o','Organisation code',`<input class="in" id="si-o" value="${S.orgCode}" placeholder="For example MCS" autocomplete="organization">`,'Loads your organisation’s logo and banner. Try MCS or NOVA.')}
    ${field('si-e','Email','<input class="in" id="si-e" type="email" placeholder="name@company.com" autocomplete="email">')}
    <div class="field"><label for="si-c">Login code</label><div class="row" style="flex-wrap:nowrap"><input class="in grow" id="si-c" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code"><button class="btn" data-act="send-code">Send code</button></div><span class="small muted" id="code-hint">We email a six-digit code to you.</span></div>
    <a class="btn pri" href="#dashboard" data-act="as-staff">Sign in</a>
    <p class="small muted" style="border-top:1px solid var(--line);padding-top:14px">Are you a candidate? <a href="#candidate-signin">Candidate sign in</a></p>${nova?`<div class="row small muted">Powered by ${LOGO.replace('class="logo"','class="logo" style="transform:scale(.6);transform-origin:left center"')}</div>`:''}`;
  return `<div class="auth"><div class="auth-form">${mark}${form}</div><div class="auth-art"><h1>${cand?'Stop scrolling. Let the right job find you.':nova?'Nova Talent on the MCS panel':'Every candidate, measured against the role.'}</h1><p style="max-width:44ch;opacity:.9">${cand?'Recruiters match your CV to open jobs and contact you when one fits.':'AI prepares the job card and the analysis. A recruiter reviews and decides.'}</p></div></div>`;
}
function portal(){
  const P=S.portal, list=S.jobs.filter(j=>j.open&&j.vis!=='Private'||j.id==='sn-dev').slice(0,4), cur=P.open||'sn-dev', r=P.res[cur], cj=S.jobs.find(j=>j.id===cur);
  const lbl={strong:'Strong match',partial:'Partial match',low:'Low match'};
  return `<div class="ptop">${LOGO}<div class="row"><span class="pill line">Sample candidate</span><a class="btn sm" href="#signin" data-act="as-staff">${ic('out')}Sign out</a></div></div>
  <div class="main"><div class="wrap">${head('Jobs for you','Pick a job and select Analyse to see how your CV matches.')}
   <div class="cols wide-left" style="grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)"><div class="stack">
    <section class="card"><h2>My CV</h2><div class="row between"><div><b style="font-weight:600">CV_2026.pdf</b><p class="small muted">Uploaded 10 Nov 2026. <span class="num">${P.used} of 2</span> uploads used this month.</p></div></div><div class="row"><button class="btn sm" data-act="replace-cv">Replace CV</button><button class="btn sm" data-act="file" data-m="We would ask you to confirm before deleting">Delete CV</button></div></section>
    <div class="stack" style="gap:10px">${list.map(j=>`<div class="jobcard ${j.id===cur?'sel':''}"><div style="min-width:0"><b style="font-weight:600">${j.title.replace(' (Squad C)','')}</b><p class="small muted">${j.partner==='Magenta Consulting Services'?'Magenta Consulting Services':'Confidential client'}</p></div>${P.res[j.id]?`<button class="btn sm" data-act="p-open" data-id="${j.id}">${fit({strong:80,partial:60,low:30}[P.res[j.id]],false)}</button>`:`<button class="btn sm pri" data-act="p-analyse" data-id="${j.id}">Analyse</button>`}</div>`).join('')}</div></div>
    <section class="card">${r?`<div><h2>Your match: ${cj.title.replace(' (Squad C)','')}</h2><p class="small muted">Based on the CV you uploaded on 10 Nov 2026.</p></div>
      <div class="band" role="img" aria-label="${lbl[r]}">${['low','partial','strong'].map(b=>`<div class="${b===r?'on':''}">${lbl[b]}</div>`).join('')}</div>
      <div><h3>How to prepare</h3><ul style="margin:6px 0 0;padding-left:20px"><li>Be ready to describe a project you delivered end to end</li><li>Review the role’s core skills and note where you have used each</li><li>A relevant certification would strengthen your match</li></ul></div>
      <p class="note">This is guidance, not a hiring decision. A recruiter reviews every application.</p><div class="row"><button class="btn pri" data-act="interest">Submit my interest</button></div>`
     :`<h2>${cj.title}</h2><p class="muted">Select Analyse on this job to see your match and how to prepare.</p>`}</section></div></div></div>`;
}

/* ---------- shell ---------- */
function dupHTML(){
  const t=(document.getElementById('nj-title')?.value||'').toLowerCase(), p=document.getElementById('nj-partner')?.value||'EY';
  const hits=S.jobs.filter(j=>j.partner===p&&t.length>3&&t.split(/\s+/).filter(w=>w.length>3).some(w=>j.title.toLowerCase().includes(w)));
  if(!hits.length) return `<h2>No similar job card</h2><p class="muted">Nothing like this exists for ${p}. AI will draft a new job card from the job description.</p><div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="draft">Draft job card with AI</button></div>`;
  return `<div class="alert" role="alert"><b>A similar job card already exists for this partner</b><span>Use and edit the existing one, or upload this as a new job card. No AI usage is spent until you choose.</span></div>
   ${hits.map(j=>`<div class="jobcard"><div style="min-width:0"><b style="font-weight:600">${j.title}</b><p class="small muted">Created by Mei Ling Tan, 10 Nov 2026. Last edited by Arjun Pillai.</p></div><a class="btn sm pri" href="#job" data-act="pick" data-id="${j.id}">Use and edit this card</a></div>`).join('')}
   <div class="row" style="justify-content:flex-end"><button class="btn" data-act="draft">Upload as a new job card</button></div>`;
}
function render(){
  let r=(location.hash||'#dashboard').slice(1); const app=document.getElementById('app');
  if(r==='signin'||r==='candidate-signin'){app.innerHTML=signin(r==='candidate-signin');return}
  if(S.role==='candidate'||r==='portal'){S.role='candidate';app.innerHTML=portal();return}
  const items=ROLES[S.role][1], top=PARENT[r]||r;
  if(!V[r]||!items.includes(top)){location.hash=items[0];return}
  const roleSel=id=>`<div class="field"><label for="${id}" class="small muted" style="font-weight:500">Preview as</label><select class="in" id="${id}" data-role>${Object.entries(ROLES).map(([k,v])=>`<option value="${k}"${k===S.role?' selected':''}>${v[0]}</option>`).join('')}</select></div>`;
  const nav=items.map(k=>`<a class="nav" href="#${k}" ${k===top?'aria-current="page"':''}>${ic(NAV[k][1])}${NAV[k][0]}</a>`).join('');
  const bn=items.slice(0,4).map(k=>`<a href="#${k}" ${k===top?'aria-current="page"':''}>${ic(NAV[k][1])}${NAV[k][0]}</a>`).join('');
  app.innerHTML=`${S.imp?`<div class="imp" role="status"><span>You are impersonating <b>${S.imp}</b>. Everything is recorded under both names.</span><button class="btn sm" data-act="imp-stop">Stop impersonating</button></div>`:''}
  <div class="shell"><nav class="side" aria-label="Main">${LOGO}${nav}<div class="side-foot">${roleSel('role-d')}<a class="nav" href="#signin">${ic('out')}Sign out</a><span class="small muted">Prototype with sample data</span></div></nav>
   <main class="main"><div class="wrap" style="gap:0"><div class="mtop">${LOGO}<span class="pill brand">${S.imp||ROLES[S.role][0]}</span></div><div class="wrap">${V[r]()}</div></div></main></div>
  <nav class="bnav" aria-label="Main">${bn}<button type="button" data-act="more">${ic('more')}More</button></nav>
  ${S.more?`<div class="sheet" data-act="more-close"><div role="dialog" aria-label="More">${items.slice(4).map(k=>`<a class="nav" href="#${k}">${ic(NAV[k][1])}${NAV[k][0]}</a>`).join('')}<div style="padding:8px 12px">${roleSel('role-m')}</div><a class="nav" href="#signin">${ic('out')}Sign out</a><button class="btn" data-act="more-close" style="margin-top:8px">Close</button></div></div>`:''}`;
  if(r==='new-job'&&S.nj.step===1) document.getElementById('dup').innerHTML=dupHTML();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act, d=el.dataset;
  if(a==='more-close'&&e.target.closest('[role=dialog]')&&!e.target.closest('button,a')) return;
  const A={
   seg(){S[d.k]=d.v}, pick(){S.job=d.id;S.tab='candidates'}, 'pick-org'(){S.org=d.id},
   'toggle-job'(){const j=S.jobs.find(x=>x.id===d.id);j.open=!j.open;toast(j.open?'Job reopened':'Job closed')},
   draft(){S.nj.step=2;toast('AI drafted the job card')}, redraft(){toast('AI drafted the job card again')},
   'save-card'(){S.nj.step=1;S.jobs.unshift({id:'sn-d'+Date.now(),title:'ServiceNow Developer (Squad D)',partner:'EY',vis:'Private',open:true,n:0});toast('Job card saved');location.hash='jobs'},
   upload(){toast('CV upload opens the file picker in the full panel')},
   'add-pool'(){const c=S.pool.splice(+d.i,1)[0];S.cands.push({n:c.n,org:c.org,cv:c.cv,s:null,st:'New',af:0,pf:0});S.tab='candidates';toast(c.n+' added. Analysis is running.')},
   approve(){S.cands[0].st='Reviewed';toast('Approved. Profile generated.');location.hash='profile'},
   reject(){S.cands[0].st='Rejected';toast('Candidate rejected');location.hash='job'},
   'send-profile'(){if(S.imp){toast('Emails cannot be sent while impersonating');return}const c=S.cands[0];c.st='Profile sent';c.pf=1;toast('Profile sent to the EY hiring contact');location.hash='job'},
   mod(){const o=S.orgs.find(x=>x.id===S.org);o.mods[d.m]=o.mods[d.m]?0:1;toast(MODS.find(m=>m[0]===d.m)[1]+(o.mods[d.m]?' switched on':' switched off'))},
   'req-access'(){const o=S.orgs.find(x=>x.id===S.org);o.access=o.access==='wait'?null:'wait';toast(o.access?'Request sent to the agency admin':'Request cancelled')},
   imp(){S.imp=S.staff[+d.i].n;toast('Impersonating '+S.imp)}, 'imp-stop'(){S.imp=null;toast('Stopped impersonating')},
   'ns-role'(){S.nsRole=d.v},
   'create-org'(){const name=g('no-name'),code=g('no-code').toUpperCase(),type=g('no-type'),em=g('no-ae');
    if(!name)return formErr('Enter the organisation name.');if(!code)return formErr('Enter an organisation code.');
    if(S.orgs.some(o=>o.code===code))return formErr('The code '+code+' is already used. Choose another.');
    if(!/.+@.+\..+/.test(em))return formErr('Enter the first admin’s email address.');
    const id='o'+Date.now(),ag=type==='Agency';
    S.orgs.push({id,name,type,code,active:true,use:0,lim:parseInt(g('no-ai'))||null,admin:em,mods:{assess:ag?1:0,portal:0,email:ag?1:0,gmail:0,avatar:0},access:null});
    S.org=id;toast('Organisation created');location.hash='organisation';return 1},
   'save-org'(){const o=S.orgs.find(x=>x.id===S.org),name=g('od-name'),code=g('od-code').toUpperCase();
    if(!name||!code){toast('Enter a name and an organisation code');return 1}
    if(S.orgs.some(x=>x!==o&&x.code===code)){toast('The code '+code+' is already used');return 1}
    o.name=name;o.code=code;o.admin=g('od-admin');o.active=g('od-status')==='Active';if(o.type!=='Own organisation')o.type=g('od-type');toast('Organisation details saved')},
   'create-staff'(){const n=g('ns-n'),em=g('ns-e'),r=g('ns-r');
    if(!n)return formErr('Enter the person’s full name.');if(!/.+@.+\..+/.test(em))return formErr('Enter a work email address.');
    if(S.staff.some(p=>p.e.toLowerCase()===em.toLowerCase()))return formErr('Someone with this email already has an account.');
    S.staff.unshift({n,e:em,r,a:true,last:'Not yet',use:0});toast(r+' account created');location.hash='staff';return 1},
   saved(){toast('Changes saved')}, file(){toast(d.m)}, noop(){},
   'send-code'(){document.getElementById('code-hint').textContent='Code sent. Check your email.';toast('Six-digit code sent');return 1},
   'as-staff'(){if(S.role==='candidate')S.role='superadmin'}, 'as-cand'(){S.role='candidate'},
   more(){S.more=true}, 'more-close'(){S.more=false},
   'p-analyse'(){S.portal.res[d.id]=d.id==='rec'?'strong':'partial';S.portal.open=d.id;toast('Analysis complete')}, 'p-open'(){S.portal.open=d.id},
   'replace-cv'(){if(S.portal.used>=2){toast('You have used both CV uploads this month');return}S.portal.used++;toast('CV replaced')},
   interest(){toast('Interest submitted. A recruiter will review it.')}
  };
  if(!A[a]) return; const skip=A[a](); if(el.tagName!=='A') e.preventDefault(); if(!skip&&el.tagName!=='A') render(); if(el.tagName==='A'&&el.getAttribute('href')===location.hash) render();
});
document.addEventListener('click',e=>{if(e.target.closest('.sheet a')) S.more=false});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-role]')){S.role=e.target.value;S.imp=null;S.more=false;if(S.role==='candidate')location.hash='portal';else if(location.hash==='#portal')location.hash=ROLES[S.role][1][0];else render()}
  if(e.target.id==='au-f'){S.auditF=e.target.value;render()}
  if(e.target.id==='ns-r'){S.nsRole=e.target.value;document.getElementById('ns-note').textContent=ROLE_NOTE[S.nsRole];document.getElementById('ns-l').value=S.nsRole==='Recruiter'?200:20}
  if(e.target.id==='nj-partner')document.getElementById('dup').innerHTML=dupHTML();
});
document.addEventListener('input',e=>{
  if(e.target.id==='nj-title')document.getElementById('dup').innerHTML=dupHTML();
  if(e.target.id==='si-o'){const was=S.orgCode.trim().toUpperCase()==='NOVA';S.orgCode=e.target.value;if((S.orgCode.trim().toUpperCase()==='NOVA')!==was){render();const i=document.getElementById('si-o');i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
  if(e.target.id==='jq'){const q=e.target.value.toLowerCase();document.querySelectorAll('.t tbody tr').forEach(tr=>tr.hidden=!tr.textContent.toLowerCase().includes(q))}
});
addEventListener('hashchange',()=>{S.more=false;render();scrollTo(0,0)});
render();
</script>
</body>
</html>
